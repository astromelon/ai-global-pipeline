# 스크립트 속 삭제: 따옴표 밖(첫 따옴표 전, 따옴표로 감싼 실행 파일 경로, 또는 ; & | ( 뒤)의 인터프리터 +
# 명령 값 안 어디든(따옴표·heredoc 안 포함) 삭제 API. 순서 무관이라 앞에서 내다본다
[[rule]]
