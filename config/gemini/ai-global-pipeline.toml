# Global Maintenance Pipeline — Gemini CLI 정책 (마스터: ~/.ai-global-pipeline.md)
# Node 3 검증 루프 명령은 자동 허용, Node 4 승인 게이트 대상은 항상 사용자 확인.
# 높은 priority가 이긴다. 게이트(900)가 허용(100)보다 위에 있어야 한다.

# ---- Node 4 승인 게이트: 원격 반영·이력 변경·삭제 ----
[[rule]]
toolName = "run_shell_command"
commandPrefix = ["git push", "git merge ", "git rebase", "git reset --hard", "git clean", "git branch -D", "glab mr", "rm ", "Remove-Item", "del ", "rmdir ", "erase ", "rd ", "ri ", "gh pr merge"]
decision = "ask_user"
priority = 900

# ---- Node 4 승인 게이트: 커밋 안 된 작업 폐기 (게이트 훅 GATED 와 같은 기준) ----
# checkout -- <파일> / checkout . / checkout -f·--force, restore(--staged 만 쓰면 제외, --worktree 는 포함),
# stash drop·clear. commandPrefix 로는 --track·--staged 같은 정상 옵션을 구분할 수 없어 정규식을 쓴다.
# Gemini 는 중첩 반복자 정규식을 ReDoS 위험으로 거부하므로(정책 파일 오류) 단순 정규식 여러 개로 나눈다.
[[rule]]
toolName = "run_shell_command"
commandRegex = "\\bgit\\b[^;&|\\n]*\\scheckout(?![-\\w])[^;&|\\n]*\\s(?:--|\\.|-f|--force)(?:\\s|$)"
decision = "ask_user"
priority = 900

[[rule]]
toolName = "run_shell_command"
commandRegex = "\\bgit\\b[^;&|\\n]*\\srestore(?![-\\w])(?![^;&|\\n]*(?:--staged|\\s-S\\b))"
decision = "ask_user"
priority = 900

[[rule]]
toolName = "run_shell_command"
commandRegex = "\\bgit\\b[^;&|\\n]*\\srestore(?![-\\w])[^;&|\\n]*(?:--worktree|\\s-W\\b)"
decision = "ask_user"
priority = 900

[[rule]]
toolName = "run_shell_command"
commandRegex = "\\bgit\\b[^;&|\\n]*\\sstash\\s+(?:drop|clear)\\b"
decision = "ask_user"
priority = 900

# ---- Node 4 승인 게이트: 훅 GATED 와 맞춘 나머지 항목 (단순 정규식, 중첩 반복자 없음) ----
[[rule]]
toolName = "run_shell_command"
commandRegex = "\\bgit\\b[^;&|\\n]*\\sswitch(?![-\\w])[^;&|\\n]*\\s(?:--discard-changes|-f|--force)(?:\\s|$)"
decision = "ask_user"
priority = 900

[[rule]]
toolName = "run_shell_command"
commandRegex = "(?i)\\bglab\\s+api\\b[^;&|\\n]*(?:-X|--method)\\s*=?\\s*(?:PUT|POST|PATCH|DELETE)\\b"
decision = "ask_user"
priority = 900

[[rule]]
toolName = "run_shell_command"
commandRegex = "(?i)\\[(?:System\\.)?IO\\.(?:File|Directory)\\]::Delete\\b"
decision = "ask_user"
priority = 900

[[rule]]
toolName = "run_shell_command"
commandRegex = "(?i)\\bStart-Process\\b[^;&|\\n]*\\sgit(?:\\.exe)?\\b"
decision = "ask_user"
priority = 900

# ---- Node 4 승인 게이트: 훅 GATED 의 우회 보강 항목 (2026-11-11). branch -Df/--delete --force, checkout <ref> <파일>,
# del/q·rd/s, xargs rm, {rm. 따옴표로 쪼갠 명령(git "push")·bash -lc 는 정책으로 구분할 수 없어 훅에서만 막는다 ----
[[rule]]
toolName = "run_shell_command"
commandRegex = "\\bgit\\b[^;&|\\n]*\\sbranch(?![-\\w])[^;&|\\n]*\\s-[a-zA-Z]*(?:D|d[a-zA-Z]*f|f[a-zA-Z]*d)[a-zA-Z]*(?:\\s|$)"
decision = "ask_user"
priority = 900

[[rule]]
toolName = "run_shell_command"
commandRegex = "\\bgit\\b[^;&|\\n]*\\sbranch(?![-\\w])[^;&|\\n]*\\s--delete\\b[^;&|\\n]*\\s(?:--force|-f)(?:\\s|$)"
decision = "ask_user"
priority = 900

[[rule]]
toolName = "run_shell_command"
commandRegex = "\\bgit\\b[^;&|\\n]*\\sbranch(?![-\\w])[^;&|\\n]*\\s--force\\b[^;&|\\n]*\\s--delete(?:\\s|$)"
decision = "ask_user"
priority = 900

[[rule]]
toolName = "run_shell_command"
commandRegex = "\\bgit\\b[^;&|\\n]*\\scheckout\\s+[^-\\s;&|<>0-9][^\\s;&|]*\\s+[^-\\s;&|<>0-9][^\\s;&|]*"
decision = "ask_user"
priority = 900

[[rule]]
toolName = "run_shell_command"
commandRegex = "(?i)(?:^|[\\s;&|{(])(?:del|rmdir|rd|erase|ri)/[sqfpa?]"
decision = "ask_user"
priority = 900

[[rule]]
toolName = "run_shell_command"
commandRegex = "\\bxargs\\b[^;&|\\n]*\\srm(?:\\s|$)"
decision = "ask_user"
priority = 900

[[rule]]
toolName = "run_shell_command"
commandRegex = "[{(`]\\s*rm(?:\\s|$)"
decision = "ask_user"
priority = 900

# ---- Node 4 승인 게이트: 같은 효과의 명령 (2026-11-13). 훅 GATED·스크립트 삭제 판정과 같은 기준 ----
# git rm(--cached 만 쓰면 제외)
[[rule]]
toolName = "run_shell_command"
commandRegex = "\\bgit\\b[^;&|\\n]*\\srm(?![-\\w])(?![^;&|\\n]*\\s--cached(?![-\\w]))"
decision = "ask_user"
priority = 900

# git pull: --ff-only 가 없으면(merge 커밋·설정 pull.rebase)
[[rule]]
toolName = "run_shell_command"
commandRegex = "\\bgit\\b[^;&|\\n]*\\spull(?![-\\w])(?![^;&|\\n]*\\s--ff-only(?![-\\w]))"
decision = "ask_user"
priority = 900

# git pull: --rebase/-r/--rebase=… 가 있으면
[[rule]]
toolName = "run_shell_command"
commandRegex = "\\bgit\\b[^;&|\\n]*\\spull(?![-\\w])[^;&|\\n]*\\s(?:--reb[\\w=-]*|-[a-zA-Z]*r[a-zA-Z]*)(?:\\s|$)"
decision = "ask_user"
priority = 900

# git update-ref -d/--delete
[[rule]]
toolName = "run_shell_command"
commandRegex = "\\bgit\\b[^;&|\\n]*\\supdate-ref(?![-\\w])[^;&|\\n]*\\s(?:-[a-zA-Z]*d[a-zA-Z]*|--d[\\w-]*)(?:\\s|$)"
decision = "ask_user"
priority = 900

# git checkout-index -f/--force
[[rule]]
toolName = "run_shell_command"
commandRegex = "\\bgit\\b[^;&|\\n]*\\scheckout-index(?![-\\w])[^;&|\\n]*\\s(?:-[a-zA-Z]*f[a-zA-Z]*|--f[\\w-]*)(?:\\s|$)"
decision = "ask_user"
priority = 900

# git worktree remove -f/--force
[[rule]]
toolName = "run_shell_command"
commandRegex = "\\bgit\\b[^;&|\\n]*\\sworktree\\s+remove(?![-\\w])[^;&|\\n]*\\s(?:-[a-zA-Z]*f[a-zA-Z]*|--f[\\w-]*)(?:\\s|$)"
decision = "ask_user"
priority = 900

# find -delete, find -exec rm/unlink
[[rule]]
toolName = "run_shell_command"
commandRegex = "\\bfind\\b[^;&|\\n]*\\s(?:-delete|-exec(?:dir)?\\s+(?:\\S*/)?(?:rm|unlink))(?:\\s|$)"
decision = "ask_user"
priority = 900

# unlink(명령 위치)
[[rule]]
toolName = "run_shell_command"
commandRegex = "(?:(?:^|[;&|({`])\\s*|\\b(?:sudo|xargs|env|exec|command|nohup|time)\\s+|/)unlink(?:\\.exe)?(?:\\s|$)"
decision = "ask_user"
priority = 900

# xargs·sudo 옵션 뒤 unlink
[[rule]]
toolName = "run_shell_command"
commandRegex = "\\b(?:xargs|sudo)\\b[^;&|\\n]*\\sunlink(?:\\s|$)"
decision = "ask_user"
priority = 900

# PowerShell .Delete() 메서드
[[rule]]
toolName = "run_shell_command"
commandRegex = "(?:\\)|\\$[\\w:]+)\\s*\\.Delete\\s*\\("
decision = "ask_user"
priority = 900

# 스크립트 속 삭제: 인터프리터 + 삭제 API(따옴표·heredoc 안 포함)
[[rule]]
toolName = "run_shell_command"
commandRegex = "^(?=[\\s\\S]*(?:(?:^|[\\s;&|({`\\\"'])(?:python[\\d.]*|py|node|deno|bun|ruby|perl|php)(?:\\.exe)?(?:[\\s;&|)}`\\\"']|$)|[/\\\\](?:python[\\d.]*|py|node|deno|bun|ruby|perl|php)(?:\\.exe)?[\\\"']?[ \\t]+[^\\s;&|)}]))[\\s\\S]*(?:\\bshutil\\.rmtree\\b|\\bos\\.(?:remove|unlink|rmdir|removedirs)\\b|\\bfs(?:\\.promises)?\\.(?:rm|rmSync|unlink|unlinkSync|rmdir|rmdirSync)\\b|\\.(?:rm|rmSync|unlinkSync|rmdirSync)\\s*\\(|\\bDeno\\.remove(?:Sync)?\\b|\\b(?:unlink|rmdir|rmtree|remove_tree|removedirs)(?:\\s*\\(|\\s+[$\\\"'@])|\\brimraf(?:\\.\\w+)?\\s*\\(|[\\\"']rimraf[\\\"']|\\bFileUtils\\.(?:rm\\w*|remove\\w*)|\\b(?:File|Dir)\\.(?:delete|unlink|rmdir)\\b)"
decision = "ask_user"
priority = 900

# ---- Node 3 검증 루프: 조회·브랜치 생성·빌드/테스트 ----
[[rule]]
toolName = "run_shell_command"
commandPrefix = ["git status", "git diff", "git log", "git show", "git rev-parse", "git branch --show-current"]
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandRegex = "^git (checkout -b|switch -c) (feat|fix|refactor|test|docs|build)/\\S+$"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = ["npm run build", "npm run lint", "npm test", "mvn compile", "mvn test", "./mvnw compile", "./mvnw test", ".\\mvnw.cmd compile", ".\\mvnw.cmd test", "./gradlew check", "./gradlew test", ".\\gradlew.bat check", ".\\gradlew.bat test", "pytest"]
decision = "allow"
priority = 100
