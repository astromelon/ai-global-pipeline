# Global Maintenance Pipeline — Gemini CLI 정책 (마스터: ~/.ai-global-pipeline.md)
# Node 3 검증 루프 명령은 자동 허용, Node 4 승인 게이트 대상은 항상 사용자 확인.
# 높은 priority가 이긴다. 게이트(900)가 허용(100)보다 위에 있어야 한다.
#
# Gemini 0.68.0 의 판정 방식(2026-11-18 확인) — 정규식을 고칠 때 반드시 지킬 것:
# - 규칙마다 '"command":"' + commandRegex 를 플래그 없는 JS RegExp 로 만들어, 인자를 키 정렬·쌍마다 NUL 로 감싼 JSON
#   ({\0"command":"…"\0,\0"description":"…"\0,…}, 명령 속 " 는 \", \ 는 \\, 줄바꿈 \n, 탭 \t)에 대고 검사한다.
#   셸 래퍼(bash -c·cmd.exe /c·powershell -Command)를 벗긴 명령과 하위 명령으로도 다시 검사한다.
# - ^ 와 끝의 $ 는 맞지 않는다. 명령 시작은 (?<=:"), 토큰 끝은 (?:\s|"|\\[nrt"]|$).
# - 반복자는 문자 클래스에만, 상한을 두고 붙인다. 그룹에는 반복자를 붙이지 않는다(선택은 (?:X|)). 그러면 Gemini 의 ReDoS
#   휴리스틱 /\([^)]*[*+?{].*\)[*+?{]/ 이 걸릴 수 없다. (?i) 금지(JS 미지원) → [Aa]. 2048자 넘으면 빠진다.
# - 공백 반복(\s* 등)을 나란히 두지 않는다(긴 공백에서 판정이 제곱으로 느려진다).
# - 명령 위치: 값 시작·; & | ( { `·JSON \n 뒤, cmd /c·pwsh -c·bash -lc 뒤, sudo·env·VAR=값·nice -n 5 같은 앞 단어 최대 3개 뒤,
#   경로·따옴표를 붙인 실행 파일 이름. git 은 전역 옵션 최대 3개(-C "경로", -c k="v") 뒤 첫 단어가 하위 명령.
# - git 훑기 [^;&|\x00\\]{0,1000} 는 NUL·JSON 이스케이프(\n \" \\)에서 멈춰 description·다음 줄·따옴표 속 메시지로 새지 않는다.
# - commandPrefix 는 대소문자를 구분하고 '"command":"<접두어>' 뒤 [\s"] 만 보므로 게이트에 쓰지 않는다.
# - 검사: ~/.ai-gate/test_gate_hooks_in_sync.py 의 GeminiPolicySafetyTest(로드·판정·훅 표본·긴 입력 속도).

# ---- Node 4 승인 게이트: git 원격 반영·이력 변경 (훅 GATED 기준: 전역 옵션 뒤 첫 단어가 하위 명령) ----
