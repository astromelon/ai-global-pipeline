# ---- Node 3 검증 루프: 조회·브랜치 생성·빌드/테스트 ----
[[rule]]
toolName = "run_shell_command"
commandPrefix = ["git status", "git diff", "git log", "git show", "git rev-parse", "git branch --show-current"]
decision = "allow"
priority = 100

# 작업 브랜치 만들기. 명령 전체가 이 한 명령일 때만(닫는 따옴표 + NUL 까지) 맞는다 — ; && | $( ) 를 붙이면 안 맞는다
[[rule]]
toolName = "run_shell_command"
commandRegex = "git (?:checkout -b|switch -c) (?:feat|fix|refactor|test|docs|build)/[A-Za-z0-9._/-]{1,200}\\\"\\x00"
decision = "allow"
priority = 100

[[rule]]
