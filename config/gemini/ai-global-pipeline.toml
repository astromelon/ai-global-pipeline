commandRegex = "(?=[^\\\"\\x00]*(?:(?:(?<=:\")|[\\s;&|({`'])(?:python[\\d.]{0,10}|py|node|deno|bun|ruby|perl|php)(?:\\.exe|)(?:[\\s;&|)}`\\\"'\\\\]|$)|[/\\\\](?:python[\\d.]{0,10}|py|node|deno|bun|ruby|perl|php)(?:\\.exe|)\\\\?[\\\"']?[ \\t]{1,20}[^\\s;&|)}])|[^\\\"\\x00]*\\\"[^\\\"\\x00]*[/\\\\](?:python[\\d.]{0,10}|py|node|deno|bun|ruby|perl|php)(?:\\.exe|)\\\\\\\"[ \\t]|[^\\x00]*(?:[;&|(]|\\\\n)\\s*(?:python[\\d.]{0,10}|py|node|deno|bun|ruby|perl|php)(?:\\.exe|)(?:[\\s;&|)}`\\\"'\\\\]|$))[^\\x00]*(?:\\bshutil\\.rmtree\\b|\\bos\\.(?:remove|unlink|rmdir|removedirs)\\b|\\bfs(?:\\.promises|)\\.(?:rm|rmSync|unlink|unlinkSync|rmdir|rmdirSync)\\b|\\.(?:rm|rmSync|unlinkSync|rmdirSync)\\s{0,20}\\(|\\bDeno\\.remove(?:Sync|)\\b|\\b(?:unlink|rmdir|rmtree|remove_tree|removedirs)(?:\\s{0,20}\\(|\\s{1,20}[$\\\"'@\\\\])|\\brimraf(?:\\.\\w{1,40}|)\\s{0,20}\\(|\\\\?[\\\"']rimraf\\\\?[\\\"']|\\bFileUtils\\.(?:rm\\w{0,40}|remove\\w{0,40})|\\b(?:File|Dir)\\.(?:delete|unlink|rmdir)\\b)"
decision = "ask_user"
